{% extends "agenda/base.html" %}

{% block title %}Acceso Staff{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-10">
    <div class="bg-white rounded-xl shadow p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-1 text-center">🦷 Acceso Staff</h1>
        <p class="text-gray-400 text-sm text-center mb-6">Ingresá con tu usuario y contraseña</p>

        {% if form.errors %}
        <div class="bg-red-100 text-red-700 border border-red-300 px-4 py-3 rounded mb-4 text-sm">
            Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Usuario</label>
                <input type="text" name="username" autofocus
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors">
                Ingresar
            </button>
        </form>
    </div>
</div>
{% endblock %}
