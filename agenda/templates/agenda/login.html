{% extends "agenda/base.html" %}

{% block title %}Acceso Staff{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-10">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-1 text-center">🦷 Acceso Staff</h1>
        <p class="text-slate-400 text-sm text-center mb-6">Ingresá con tu usuario y contraseña</p>

        {% if form.errors %}
        <div class="bg-rose-50 text-rose-700 border border-rose-200 px-4 py-3 rounded-lg mb-4 text-sm">
            Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-semibold text-slate-700 mb-1">Usuario</label>
                <input type="text" name="username" autofocus
                       class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                <input type="password" name="password"
                       class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400">
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit"
                    class="w-full bg-teal-700 hover:bg-teal-800 text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm">
                Ingresar
            </button>
        </form>
    </div>
</div>
{% endblock %}
