<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agenda Dental{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                },
            },
        };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <!-- Navbar -->
    <nav class="bg-teal-800 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
            <a href="{% url 'calendario' %}" class="text-xl font-bold tracking-tight flex items-center gap-2">
                <span class="text-2xl">🦷</span>
                <span>Clínica Dental</span>
            </a>
            <div class="flex gap-3 items-center text-sm">
                {% if user.is_authenticated %}
                    <span class="hidden sm:inline text-teal-100">{{ user.get_full_name|default:user.username }}</span>
                    <a href="{% url 'staff_calendario' %}" class="bg-white text-teal-800 px-4 py-1.5 rounded-full font-semibold hover:bg-teal-50 transition-colors">Panel Staff</a>
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-teal-100 hover:text-white hover:underline underline-offset-2 bg-transparent border-0 cursor-pointer transition-colors">Salir</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="bg-white text-teal-800 px-4 py-1.5 rounded-full font-semibold hover:bg-teal-50 transition-colors">Staff</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Mensajes -->
    {% if messages %}
    <div class="max-w-6xl mx-auto px-4 sm:px-6 mt-4">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-lg mb-2 text-sm font-medium {% if message.tags == 'error' %}bg-rose-50 text-rose-700 border border-rose-200{% else %}bg-emerald-50 text-emerald-700 border border-emerald-200{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Contenido -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
